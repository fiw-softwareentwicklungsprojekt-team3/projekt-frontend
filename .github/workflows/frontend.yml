# Baut das Frontend und führt alle Unit-Tests aus, bei jedem Push und PR
name: Frontend CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js 24 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Bauen (Build)
        run: npm run build

      - name: Tests ausführen
        env:
          CI: true
        run: npm test -- --watch=false